name: GitHub Pages

# Publie le client en mode invité sur GitHub Pages à chaque push sur main, donc à chaque
# fusion de develop dans main. Rien n'est publié depuis develop ni depuis une branche de travail.
# Pages n'héberge que des fichiers statiques : sans serveur, le jeu se joue en invité
# avec les 100 cartes intégrées (pas de compte, de classement ni de Slack IA).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build du client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oss/shared build
      - run: pnpm --filter @oss/client build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  deploy:
    name: Déploiement
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
