# Blueprint Render : serveur Fastify. La base PostgreSQL est hébergée sur Supabase
# (projet `open-space-simulator`, région eu-central-1, voir README § Déploiement).
# Render → New → Blueprint → choisir ce dépôt. Les valeurs marquées `sync: false` sont
# demandées au moment de la création et ne sont jamais écrites dans le dépôt.
services:
  - type: web
    name: oss-server
    runtime: node
    plan: free
    region: frankfurt
    # Seul main est déployé ; develop sert aux tests avant la mise en production.
    branch: main
    healthCheckPath: /api/health
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @oss/shared build &&
      pnpm --filter @oss/server build
    # Migrations puis seed (idempotent : 100 cartes, succès, compte admin) avant de démarrer.
    startCommand: >-
      pnpm --filter @oss/server db:deploy &&
      pnpm --filter @oss/server db:seed &&
      pnpm --filter @oss/server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: LOG_LEVEL
        value: info
      # URL du « Session pooler » Supabase (IPv4, port 5432), suivie de ?sslmode=require :
      # postgresql://postgres.<ref>:<mot-de-passe>@<hôte>.pooler.supabase.com:5432/postgres?sslmode=require
      # Elle sert aux migrations, au seed et au serveur.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # URL du client Vercel, par exemple https://open-space-simulator.vercel.app
      - key: CLIENT_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Facultatif : connexion GitHub (OAuth App, callback ${CLIENT_URL}/api/auth/github/callback)
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Facultatif : Slack piloté par l'IA. Sans clé, le jeu utilise les templates.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: AI_DAILY_QUOTA
        value: '40'
